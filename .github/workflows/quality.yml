name: Quality

on:
  pull_request:
    branches: [main, test-live]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Pflichtprüfung für jeden PR. Der Jobname ist eine Required-Check-Regel und bleibt gleich.
  checks:
    name: Required quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; Node 24
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; Node 24
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm run typecheck
      - name: ESLint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: Install Chromium
        run: |
          # Gleiche signierte Ubuntu-Quellen; der offizielle Spiegel war deutlich schneller als Azure.
          sudo sed -i \
            -e '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|s/priority:1/priority:2/' \
            -e '\|^https://archive\.ubuntu\.com/ubuntu/|s/priority:2/priority:1/' \
            /etc/apt/apt-mirrors.txt
          pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm run test:browser
      - name: Upload browser screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-checks
          path: .qa-output/browser
          retention-days: 7
          if-no-files-found: ignore

  # Große Prüfung in drei Engines: nur für Veröffentlichungs-PRs nach main oder von Hand gestartet.
  full:
    name: Vollprüfung (${{ matrix.browser }})
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Chromium braucht für alle Suiten nacheinander rund zwei Stunden (Messung 21.11.2026, 4 Kerne).
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; Node 24
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; Node 24
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm run build
      - name: Install ${{ matrix.browser }}
        run: |
          sudo sed -i \
            -e '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|s/priority:1/priority:2/' \
            -e '\|^https://archive\.ubuntu\.com/ubuntu/|s/priority:2/priority:1/' \
            /etc/apt/apt-mirrors.txt
          pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Full browser tests
        run: pnpm run test:full -- --browser ${{ matrix.browser }}
      - name: Upload browser screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-full-${{ matrix.browser }}
          path: .qa-output/browser
          retention-days: 7
          if-no-files-found: ignore
