name: Quality

on:
  pull_request:
    branches: [main, test-live]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Required quality checks
    runs-on: ubuntu-24.04
    # Existing combined browser job: user-authorised 50-minute ceiling, all steps retained.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; Node 24
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; Node 24
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            qa/pnpm-lock.yaml
      - name: Bind Quality to this PR and integration base
        run: node scripts/release/quality-context.cjs capture
      - name: Verify read access and current PR before expensive checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/quality-context.cjs verify
      - name: Install application with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm run typecheck
      - name: ESLint
        run: pnpm run lint
      - name: Release policy and Git integration tests
        run: node --test tests/release/*.test.cjs
      - name: Automated tests
        run: pnpm test
      - name: Production build
        run: pnpm run build
      - name: Content integrity
        run: pnpm run verify
      - name: Install browser tools with frozen lockfile
        run: pnpm --dir qa install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm --dir qa exec playwright install --with-deps chromium
      - name: Install additional browser engines
        run: pnpm --dir qa exec playwright install --with-deps firefox webkit
      - name: Early actual-engine keyboard search before the complete regression
        run: node tests/browser/journey-engines.mjs --search-only
      - name: Production browser regression
        run: pnpm run test:browser
      - name: Actual Firefox and WebKit journey checks
        run: node tests/browser/journey-engines.mjs
      - name: Handoff with actual engine evidence
        run: node scripts/handoff.mjs --require-engines
      - name: Reject stale PR head, base or unexpected workflow origin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/quality-context.cjs verify
      - name: Read-only original news-source readiness report
        run: node scripts/news/readiness.mjs --ci-report
      - name: Prepare bounded review evidence
        if: always()
        run: node scripts/review-evidence.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .qa-output/review/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
